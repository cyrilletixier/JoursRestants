name: Deploy JoursRestants to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # Nouvelle tentative automatique : l'API Pages de GitHub échoue
      # de façon transitoire ("artifact metadata failed"). On réessaie
      # après une pause, la méthode officielle recommandée.
      - name: Pause avant nouvelle tentative
        if: failure()
        run: sleep 45
      - name: Nouvelle tentative de déploiement
        id: deployment-retry
        if: failure()
        uses: actions/deploy-pages@v4
      - name: Dernière tentative (après longue pause)
        id: deployment-retry-2
        if: failure()
        run: |
          sleep 90
          echo "Troisième salve dans 90 secondes."
      - name: Déploiement final
        id: deployment-final
        if: failure()
        uses: actions/deploy-pages@v4
